[package]
name = "vinylnx_core"
version = "0.1.0"
edition = "2021"
authors = ["Christian Tosta"]
description = "Optical motor for Vinyl theme: light and micro-texture calculus"

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"

[profile.release]
# Extremme optimizations for 140Hz performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
